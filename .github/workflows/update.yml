name: Atualizar dados (diário)

# Roda 2x por dia: 10:00 e 19:00 UTC (07:00 e 16:00 no horário de Brasília) e permite disparo manual.
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # necessário para o robô conseguir commitar o data.json

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar dados
        run: python scripts/fetch_data.py

      - name: Commitar data.json (se mudou)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualiza dados $(date -u +%Y-%m-%d)"
            git push
          fi
